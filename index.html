<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anil's Blog</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <style>
    :root {
      --bg-primary: #ffffff;
      --text-primary: #212529;
      --card-bg: #f8f9fa;
      --border-color: #e9ecef;
      --sidebar-bg: #f8f9fa;
    }
    .dark-mode {
      --bg-primary: #121212;
      --text-primary: #f8f9fa;
      --card-bg: #1e1e1e;
      --border-color: #333;
      --sidebar-bg: #1e1e1e;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
    }
    .blog-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }
    .blog-img {
      height: 200px;
      object-fit: cover;
    }
    .navbar-brand, .nav-link {
      font-weight: 600;
    }
    .load-more-btn {
      transition: opacity 0.2s;
    }

    /* Sidebar styling */
    .sidebar {
      background: var(--sidebar-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      height: fit-content;
    }
    .sidebar h5 {
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .sidebar a {
      display: block;
      color: var(--text-primary);
      text-decoration: none;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-color);
      transition: color 0.2s;
    }
    .sidebar a:hover {
      color: #21ADE2;
    }
    .sidebar a:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Anil's Blog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          <li class="nav-item">
            <button id="darkModeToggle" class="btn btn-sm btn-outline-secondary ms-2">🌙 Dark</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content + Sidebar -->
  <div class="container flex-grow-1">
    <div class="row g-4">
      <!-- Blog Posts (Main Content) -->
      <div class="col-lg-8">
        <div class="row g-4" id="blogPosts">
          <!-- Blog posts will be inserted here -->
        </div>

        <div class="text-center mt-5">
          <button id="loadMoreBtn" class="btn btn-primary load-more-btn">Load More</button>
        </div>
      </div>

      <!-- Right Sidebar -->
      <div class="col-lg-4">
        <div class="sidebar">
          <h5>Quick Links</h5>
          <a href="#" data-bs-toggle="modal" data-bs-target="#dateConverterModal">मिति रूपान्तरण</a>
          <a href="https://www.youtube.com/@kho" target="_blank" rel="noopener">My YouTube Channel</a>
          <a href="https://dropbox.com/your-audio-page" target="_blank" rel="noopener">Audio Stories</a>
          <a href="https://github.com/yourusername" target="_blank" rel="noopener">GitHub</a>
          <a href="https://linkedin.com/in/yourprofile" target="_blank" rel="noopener">LinkedIn</a>
          <a href="mailto:anil@example.com">Email Me</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light py-4 mt-5 border-top">
    <div class="container text-center text-muted">
      <p>© 2026 Anil Maharjan. All rights reserved.</p>
    </div>
  </footer>

  <!-- Date Converter Modal – Compact Classic Widget (186px) -->
  <div class="modal fade" id="dateConverterModal" tabindex="-1" aria-labelledby="dateConverterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 320px; margin: auto;">
      <div class="modal-content" style="background-color: #1e1e1e; color: #ffffff; border: 1px solid #333; border-radius: 10px; overflow: hidden; padding: 12px;">
        <div class="modal-header p-1" style="background: #1a1a1a; border-bottom: 1px solid #333; text-align: center; position: relative;">
          <h6 class="modal-title" id="dateConverterModalLabel" style="font-weight: bold; color: #21ADE2; margin: 0; font-size: 1.05rem; flex: 1;">
            <u>Nepali Date Converter</u>
          </h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
            style="filter: invert(1); background: none; border: none; padding: 4px; margin-left: auto; margin-right: 0;"></button>
        </div>
        <div class="modal-body p-0 mt-2" style="text-align: center;">
          <!-- EXACT WIDGET CODE AS PROVIDED -->
          <iframe 
            src="https://www.ashesh.com.np/linkdate-converter.php?h_color=21ADE2&b_color=CFE4B1&api=240116p384" 
            frameborder="0" 
            scrolling="no" 
            marginwidth="0" 
            marginheight="0" 
            style="border: none; overflow: hidden; width: 100%; height: 186px;" 
            allowtransparency="true">
          </iframe>
          <br>
          <span style="color: #aaa; font-size: 10px; text-align: left; display: block; margin-top: 6px;">
            
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap + Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const blogData = [
      {
        id: 1,
        title: "My Journey as a 2D Explainer Creator",
        excerpt: "Sharing insights from over a decade of creating visual stories that simplify complex ideas.",
        date: "Jan 1, 2026",
        image: "https://via.placeholder.com/600x200/4e73df/ffffff?text=Animation+Journey"
      },
      {
        id: 2,
        title: "Building Productive Habits in 2026",
        excerpt: "How I use digital tools to track goals and maintain consistency in creative work.",
        date: "Dec 28, 2025",
        image: "https://via.placeholder.com/600x200/1cc88a/ffffff?text=Habit+Tracking"
      },
      {
        id: 3,
        title: "Web Development Tips for Creators",
        excerpt: "Blend design and functionality to showcase your portfolio beautifully online.",
        date: "Dec 20, 2025",
        image: "https://via.placeholder.com/600x200/36b9cc/ffffff?text=Web+Dev+Tips"
      }
    ];

    function renderPosts(posts) {
      const container = document.getElementById('blogPosts');
      posts.forEach(post => {
        const card = `
          <div class="col-md-6">
            <div class="blog-card h-100">
              <img src="${post.image}" class="blog-img w-100" alt="${post.title}">
              <div class="p-4">
                <small class="text-muted">${post.date}</small>
                <h5 class="mt-2">${post.title}</h5>
                <p class="mt-3">${post.excerpt}</p>
                <a href="#" class="btn btn-sm btn-outline-primary">Read More</a>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    renderPosts(blogData);

    // Dark mode toggle
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;
    const isDark = localStorage.getItem('darkMode') === 'true';
    if (isDark) {
      body.classList.add('dark-mode');
      darkModeToggle.textContent = '☀️ Light';
    }

    darkModeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      const isActive = body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isActive);
      darkModeToggle.textContent = isActive ? '☀️ Light' : '🌙 Dark';
    });

    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      alert("In a real app, this would fetch more posts!");
    });
  </script>
</body>
</html>
