<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mero Learning</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #222;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .bg-dark-custom {
      background-color: #1a1a1a !important;
    }

    .text-warning-custom {
      color: #ff9900 !important;
    }

    .sidebar-link {
      display: block;
      padding: 0.4rem 0;
      color: #ddd;
      text-decoration: none;
      border-left: 3px solid transparent;
    }

    .sidebar-link:hover,
    .sidebar-link.active {
      color: #ff9900;
      border-left-color: #ff9900;
    }

    .video-thumb {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .video-thumb::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      color: white;
      opacity: 0.8;
    }

    footer {
      background-color: #1a1a1a;
      padding: 1.5rem 0;
      margin-top: auto;
    }

    main {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="bg-dark-custom py-2">
    <div class="container d-flex align-items-center">
      <div class="text-white fw-bold" style="font-size: 1.8rem;">MERO LEARNING</div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container my-4">
    <div class="row">

      <!-- BLOG CONTENT AREA -->
      <div class="col-lg-8" id="blogContent">
        <!-- Content will be loaded here based on URL hash -->
      </div>

      <!-- RIGHT SIDEBAR -->
      <aside class="col-lg-4">
        <div class="bg-dark-custom p-3 rounded">
          <h6 class="text-white mb-3">Pages</h6>
          <a href="#page=home" class="sidebar-link active" data-page="home">Home</a>
          <a href="#page=tips" class="sidebar-link" data-page="tips">Tips & Tricks</a>
          <a href="#page=animation" class="sidebar-link" data-page="animation">12 Principles of Animation</a>
          <a href="#page=community" class="sidebar-link" data-page="community">Agora Community</a>
          <a href="#page=tutorials" class="sidebar-link" data-page="tutorials">Tutorials</a>
          <a href="#page=reviews" class="sidebar-link" data-page="reviews">Animation Reviews</a>
        </div>
      </aside>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container text-center text-muted">
      &copy; 2025 Mero Learning. All rights reserved.
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Blog content for each "page"
    const pages = {
      home: `
        <h2 class="text-warning-custom">Welcome to Mero Learning</h2>
        <p class="text-muted">Tuesday, December 30, 2025</p>
        <div class="mt-3">
          <div class="video-thumb rounded mb-3" style="background: #0066cc; height: 250px; display: flex; align-items: center; justify-content: center; color: white;">
            Weight Animation Tips
          </div>
          <p>
            Two CRUCIAL tips for showing weight in animation: squash & stretch, and timing. Master these to bring life to your characters!
          </p>
        </div>
      `,
      tips: `
        <h2 class="text-warning-custom">Animation Tips & Tricks</h2>
        <p class="text-muted">Monday, November 10, 2025</p>
        <div class="mt-3">
          <div class="video-thumb rounded mb-3" style="background: #cc3300; height: 200px; display: flex; align-items: center; justify-content: center; color: white;">
            Overlapping Action
          </div>
          <p>
            Use overlapping action to make movements feel organic. Hair, clothing, and limbs should not stop at the same time.
          </p>
        </div>
      `,
      animation: `
        <h2 class="text-warning-custom">12 Principles of Animation</h2>
        <p class="text-muted">Friday, October 4, 2025</p>
        <div class="mt-3">
          <div class="video-thumb rounded mb-3" style="background: #339900; height: 220px; display: flex; align-items: center; justify-content: center; color: white;">
            Squash & Stretch
          </div>
          <p>
            The most fundamental principle—gives the illusion of weight and volume as objects move.
          </p>
        </div>
      `,
      community: `
        <h2 class="text-warning-custom">Agora Community Highlights</h2>
        <p class="text-muted">Wednesday, September 18, 2025</p>
        <div class="mt-3">
          <p>Join animators worldwide in collaborative projects, feedback sessions, and live Q&As.</p>
          <p>Recent topic: "How to animate fear without facial expressions."</p>
        </div>
      `,
      tutorials: `
        <h2 class="text-warning-custom">Maya Rigging Tutorials</h2>
        <p class="text-muted">Sunday, August 25, 2025</p>
        <div class="mt-3">
          <div class="video-thumb rounded mb-3" style="background: #663399; height: 240px; display: flex; align-items: center; justify-content: center; color: white;">
            IK/FK Switch
          </div>
          <p>
            Step-by-step guide to creating a seamless IK/FK switch in Autodesk Maya for character rigs.
          </p>
        </div>
      `,
      reviews: `
        <h2 class="text-warning-custom">Animation Reviews</h2>
        <p class="text-muted">Saturday, July 12, 2025</p>
        <div class="mt-3">
          <p><strong>"Arcane" Season 2 Breakdown:</strong> How the show blends 2D and 3D for emotional storytelling.</p>
          <p>Key takeaways: camera choreography, silhouette clarity, and secondary motion.</p>
        </div>
      `
    };

    // Get content area
    const contentArea = document.getElementById('blogContent');
    const links = document.querySelectorAll('.sidebar-link');

    // Function to load page
    function loadPage(pageKey) {
      contentArea.innerHTML = pages[pageKey] || '<p>Page not found.</p>';
      
      // Update active link
      links.forEach(link => {
        if (link.dataset.page === pageKey) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    // Handle hash changes (e.g., #page=home)
    function handleHashChange() {
      const hash = window.location.hash;
      const match = hash.match(/page=([a-z]+)/);
      const pageKey = match ? match[1] : 'home';
      loadPage(pageKey);
    }

    // Initial load
    window.addEventListener('load', handleHashChange);
    window.addEventListener('hashchange', handleHashChange);

    // Optional: Smooth scroll to top on page change
    window.addEventListener('hashchange', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
